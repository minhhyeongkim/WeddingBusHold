<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff8f4"/>
      <stop offset="50%"  stop-color="#fdf2ea"/>
      <stop offset="100%" stop-color="#f5e8dc"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="100"  cy="100" r="90"  fill="#f4c8a0" opacity="0.45"/>
  <circle cx="1100" cy="530" r="110" fill="#f4c8a0" opacity="0.35"/>
  <circle cx="50"   cy="560" r="68"  fill="#f8d4b0" opacity="0.40"/>
  <circle cx="1150" cy="80"  r="78"  fill="#f8d4b0" opacity="0.35"/>

  <!-- Card -->
  <rect x="250" y="90" width="700" height="450" rx="28" fill="white" opacity="0.97" filter="url(#shadow)"/>
  <!-- Card top accent -->
  <rect x="250" y="90" width="700" height="6" rx="3" fill="#e07830" opacity="0.80"/>

  <!-- Bus icon (simplified) -->
  <g transform="translate(600, 230)">
    <!-- bus body -->
    <rect x="-52" y="-30" width="104" height="60" rx="10" fill="#e07830" opacity="0.15" stroke="#e07830" stroke-width="2"/>
    <!-- windows -->
    <rect x="-40" y="-20" width="22" height="18" rx="4" fill="#e07830" opacity="0.5"/>
    <rect x="-10" y="-20" width="22" height="18" rx="4" fill="#e07830" opacity="0.5"/>
    <rect x="20"  y="-20" width="22" height="18" rx="4" fill="#e07830" opacity="0.5"/>
    <!-- wheels -->
    <circle cx="-28" cy="32" r="10" fill="#e07830" opacity="0.6"/>
    <circle cx="28"  cy="32" r="10" fill="#e07830" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="600" y="360"
    text-anchor="middle" font-size="54" font-weight="700"
    fill="#1a1a1a" letter-spacing="-1"
    font-family="'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif">
    버스 탑승 체크인
  </text>

  <!-- Subtitle -->
  <text x="600" y="412"
    text-anchor="middle" font-size="22" fill="#5a6070"
    font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="400">
    아벤티움 웨딩홀 · 12:30 예식
  </text>

  <!-- Dot decoration -->
  <circle cx="564" cy="450" r="4" fill="#e07830" opacity="0.5"/>
  <circle cx="584" cy="450" r="4" fill="#e07830" opacity="0.7"/>
  <circle cx="600" cy="450" r="5" fill="#e07830"/>
  <circle cx="616" cy="450" r="4" fill="#e07830" opacity="0.7"/>
  <circle cx="636" cy="450" r="4" fill="#e07830" opacity="0.5"/>
</svg>
