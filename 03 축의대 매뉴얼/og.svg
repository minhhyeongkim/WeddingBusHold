<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fffdf9"/>
      <stop offset="50%"  stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#f5ede0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="100"  cy="100" r="90"  fill="#e8d5b0" opacity="0.45"/>
  <circle cx="1100" cy="530" r="110" fill="#e8d5b0" opacity="0.35"/>
  <circle cx="50"   cy="560" r="68"  fill="#f0e4c8" opacity="0.40"/>
  <circle cx="1150" cy="80"  r="78"  fill="#f0e4c8" opacity="0.35"/>
  <circle cx="600"  cy="20"  r="48"  fill="#e8d5b0" opacity="0.40"/>

  <!-- Card -->
  <rect x="250" y="90" width="700" height="450" rx="28" fill="white" opacity="0.97" filter="url(#shadow)"/>
  <!-- Card top accent -->
  <rect x="250" y="90" width="700" height="6" rx="3" fill="#b8944a" opacity="0.70"/>

  <!-- Divider lines decorative -->
  <line x1="430" y1="200" x2="770" y2="200" stroke="#e8d5b0" stroke-width="1"/>
  <line x1="430" y1="460" x2="770" y2="460" stroke="#e8d5b0" stroke-width="1"/>

  <!-- Role badge: 하객 응대 -->
  <rect x="330" y="230" width="140" height="36" rx="8" fill="#fdf0f3" stroke="#e0a8b8" stroke-width="1"/>
  <text x="400" y="254" text-anchor="middle" font-size="15" fill="#b0485e"
    font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600">🤝 하객 응대</text>

  <!-- Role badge: 명부 기입 -->
  <rect x="530" y="230" width="140" height="36" rx="8" fill="#eef4fc" stroke="#a8c4e4" stroke-width="1"/>
  <text x="600" y="254" text-anchor="middle" font-size="15" fill="#2d5f9a"
    font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600">📋 명부 기입</text>

  <!-- Role badge: 공통 정보 -->
  <rect x="730" y="230" width="140" height="36" rx="8" fill="#fdf8f0" stroke="#e8d5b0" stroke-width="1"/>
  <text x="800" y="254" text-anchor="middle" font-size="15" fill="#8a6830"
    font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="600">📌 공통 정보</text>

  <!-- Title -->
  <text x="600" y="360"
    text-anchor="middle" font-size="58" font-weight="700"
    fill="#1a1a1a" letter-spacing="-1"
    font-family="'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif">
    축의대 매뉴얼
  </text>

  <!-- Subtitle -->
  <text x="600" y="410"
    text-anchor="middle" font-size="22" fill="#5a6070"
    font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="400">
    아벤티움 3층 · 12:30 예식 · 축의대 11:30 오픈
  </text>

  <!-- Dot decoration -->
  <circle cx="564" cy="448" r="4" fill="#b8944a" opacity="0.6"/>
  <circle cx="584" cy="448" r="4" fill="#b8944a" opacity="0.8"/>
  <circle cx="600" cy="448" r="5" fill="#b8944a"/>
  <circle cx="616" cy="448" r="4" fill="#b8944a" opacity="0.8"/>
  <circle cx="636" cy="448" r="4" fill="#b8944a" opacity="0.6"/>
</svg>
